# Retrieval evaluation, Think Python 2e (the library book), Vietnamese learner questions.
# STATUS: draft by P1, labelled from the textbook's structure BEFORE the book was indexed, so the labels do not depend
# on retriever output. The raw pages were not readable from P1's environment, so every `contains` snippet is a phrase the
# book is expected to use: before scoring, P1 or P3 must confirm each one exists in the indexed chunks
# (`select source_uri, section from chunks where content ilike '%<snippet>%'`) and correct any that do not. Add
# `source_uri` to each entry once the indexed URLs are known (both must then match).
# SIZE: 10 questions, below the README's minimum of 20. One question moves hit rate by 10 points; the report says so.
# P4's >= 20 labelled questions are the full set. SPLIT: q01-q05 may be used for tuning; q06-q10 are HELD OUT, never tune on them.
# subject: the library subject slug is the book slug until P3 adds a Vietnamese label via the manifest; update if it changes.
subject: think-python-2e
questions:
  - id: q01
    question_vi: "Làm sao lấy phần dư khi chia hai số nguyên trong Python?"
    relevant:
      - contains: "modulus operator"
    note: "definition/how. Expected: ch. 5 Conditionals and recursion, floor division and modulus (5.1)."
  - id: q02
    question_vi: "Biểu thức cho kết quả đúng hoặc sai thì gọi là gì?"
    relevant:
      - contains: "boolean expression"
    note: "definition. Expected: ch. 5, boolean expressions (5.2)."
  - id: q03
    question_vi: "Khác nhau giữa and, or và not khi ghép các điều kiện là gì?"
    relevant:
      - contains: "logical operators"
    note: "difference. Expected: ch. 5, logical operators (5.3)."
  - id: q04
    question_vi: "Khi có hơn hai trường hợp thì viết điều kiện thế nào cho gọn thay vì lồng nhiều if?"
    relevant:
      - contains: "chained conditional"
    note: "how. Expected: ch. 5, chained conditionals (5.6)."
  - id: q05
    question_vi: "Tại sao một hàm tự gọi chính nó có thể chạy mãi không dừng?"
    relevant:
      - contains: "infinite recursion"
    note: "why. Expected: ch. 5, infinite recursion (5.10)."
  - id: q06
    question_vi: "Làm thế nào để lặp lại một đoạn lệnh cho đến khi điều kiện không còn đúng?"
    relevant:
      - contains: "while statement"
    note: "how, HELD OUT. Expected: ch. 7 Iteration, the while statement (7.3)."
  - id: q07
    question_vi: "Tại sao tôi không thể đổi một ký tự trong chuỗi bằng cách gán vào vị trí của nó?"
    relevant:
      - contains: "immutable"
    note: "why, HELD OUT. Expected: ch. 8 Strings, strings are immutable (8.5)."
  - id: q08
    question_vi: "Cắt lấy một đoạn của chuỗi bằng cách nào?"
    relevant:
      - contains: "segment of a string"
    note: "how, HELD OUT. Expected: ch. 8, string slices (8.4)."
  - id: q09
    question_vi: "Danh sách khác chuỗi ở điểm nào khi muốn sửa phần tử?"
    relevant:
      - contains: "lists are mutable"
    note: "difference, HELD OUT. Expected: ch. 10 Lists, lists are mutable (10.2)."
  - id: q10
    question_vi: "Dùng cấu trúc nào để tra giá trị theo khóa thay vì theo chỉ số số nguyên?"
    relevant:
      - contains: "key-value pair"
    note: "what, HELD OUT. Expected: ch. 11 Dictionaries, a dictionary is a mapping (11.1)."
